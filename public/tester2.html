<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GLB Tester (URL Vars)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
        }
      }
      </script>
</head>
<body>

<div id="info">
  Add URL params:<br>
  ?model=model.glb&anim=animations.glb
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// =========================
// GET URL VARIABLES
// =========================
const params = new URLSearchParams(window.location.search);

const MODEL_URL = params.get('model') || 'model.glb';
const ANIM_URL  = params.get('anim')  || 'animations.glb';

console.log("Model URL:", MODEL_URL);
console.log("Animation URL:", ANIM_URL);

// =========================
// SCENE SETUP
// =========================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(3, 5, 2);
scene.add(dirLight);

// =========================
// LOADING
// =========================
const loader = new GLTFLoader();

let mixer;
const clock = new THREE.Clock();
let modelRoot;

// LOAD MODEL
loader.load(
  MODEL_URL,
  (gltf) => {

    modelRoot = gltf.scene;
    scene.add(modelRoot);

    console.log("Model loaded:", MODEL_URL);
    console.log("Embedded animations:", gltf.animations);

    // LOAD ANIMATIONS
    loader.load(
      ANIM_URL,
      (animGltf) => {

        console.log("Animations loaded:", ANIM_URL);
        console.log("Animations found:", animGltf.animations);

        if (!animGltf.animations.length) {
          console.warn("No animations found in file");
          return;
        }

        mixer = new THREE.AnimationMixer(modelRoot);

        animGltf.animations.forEach((clip) => {
          console.log("Playing:", clip.name);
          mixer.clipAction(clip).play();
        });

      },
      undefined,
      (err) => console.error("Animation load error:", err)
    );

  },
  undefined,
  (err) => console.error("Model load error:", err)
);

// =========================
// RENDER LOOP
// =========================
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);

  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
