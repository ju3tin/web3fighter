<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Three.js JSON → GLB Converter & Viewer</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:Arial, sans-serif; }
        canvas { display:block; }
        #ui {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px;
            pointer-events: auto; z-index: 100;
        }
        button { padding: 10px 16px; font-size: 16px; margin-top: 8px; cursor: pointer; }
        #info { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; font-size: 14px; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <strong>MakeHuman JSON → GLB Tool</strong><br><br>
        <button id="loadBtn">Load human.json</button><br>
        <button id="exportBtn" disabled>Download human.glb</button>
    </div>
    <div id="info">Left drag = rotate • Scroll = zoom • Right drag = pan</div>
    <div id="status">Loading and parsing JSON...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        let scene, camera, renderer, controls, model;

        function initViewer() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 8);
            scene.add(dirLight);

            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1, 0);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Load JSON
        document.getElementById('loadBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById('status').style.display = 'block';
                document.getElementById('status').textContent = 'Parsing JSON...';

                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const json = JSON.parse(ev.target.result);
                        const loader = new THREE.ObjectLoader();
                        model = loader.parse(json);

                        // Clean up previous model
                        while(scene.children.length > 2) scene.remove(scene.children[2]);

                        scene.add(model);

                        // Enable shadows on meshes
                        model.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        // Auto center camera
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        camera.position.set(center.x, center.y + maxDim * 0.7, center.z + maxDim * 1.5);
                        controls.target.copy(center);
                        controls.update();

                        document.getElementById('exportBtn').disabled = false;
                        document.getElementById('status').style.display = 'none';
                        console.log('JSON loaded successfully!', model);
                    } catch (err) {
                        alert('Error parsing JSON: ' + err.message);
                        document.getElementById('status').style.display = 'none';
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // Export to GLB
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!model) return;
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = 'Exporting to GLB...';

            const exporter = new THREE.GLTFExporter();
            exporter.parse(
                model,
                (result) => {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'human.glb';
                    a.click();
                    URL.revokeObjectURL(url);
                    document.getElementById('status').style.display = 'none';
                },
                { binary: true }   // true = .glb   false = .gltf
            );
        });

        // Start the viewer
        initViewer();
    </script>
</body>
</html>
