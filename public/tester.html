<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GLB Model + Animation Tester</title>

  <!-- REQUIRED: fixes "three" module error -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      font-size: 13px;
      border-radius: 6px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="info">
  Loading: model.glb + animations.glb
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ----------------------
// SCENE SETUP
// ----------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(3, 5, 2);
scene.add(dirLight);

// ----------------------
// LOADER
// ----------------------
const loader = new GLTFLoader();

let mixer;
const clock = new THREE.Clock();
let modelRoot;

// ----------------------
// LOAD MODEL
// ----------------------
loader.load(
  '/models/1aa.glb',
  (gltf) => {

    modelRoot = gltf.scene;
    scene.add(modelRoot);

    console.log("Model loaded");
    console.log("Model embedded animations:", gltf.animations);

    // ----------------------
    // LOAD SEPARATE ANIMATIONS
    // ----------------------
    loader.load(
      '/anime/unanimation1a.glb',
      (animGltf) => {

        console.log("Animation file loaded");
        console.log("Animations found:", animGltf.animations);

        if (!animGltf.animations || animGltf.animations.length === 0) {
          console.warn("No animations found in animations.glb");
          return;
        }

        mixer = new THREE.AnimationMixer(modelRoot);

        animGltf.animations.forEach((clip) => {
          console.log("Playing clip:", clip.name);
          mixer.clipAction(clip).play();
        });

      },
      undefined,
      (err) => console.error("Animation load error:", err)
    );

  },
  undefined,
  (err) => console.error("Model load error:", err)
);

// ----------------------
// ANIMATION LOOP
// ----------------------
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);

  renderer.render(scene, camera);
}

animate();

// ----------------------
// RESIZE
// ----------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
