<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MakeHuman JSON → GLB Converter & Viewer (Fixed)</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:Arial, sans-serif; }
        canvas { display:block; }
        #ui { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; z-index:100; }
        button { padding:12px 18px; font-size:16px; margin:5px 0; cursor:pointer; }
        #status { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); padding:20px 40px; border-radius:10px; display:none; font-size:18px; }
        #info { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.6); padding:8px; border-radius:6px; }
    </style>
</head>
<body>
    <div id="ui">
        <strong>MakeHuman JSON → GLB Tool (Fixed)</strong><br><br>
        <button id="loadBtn">1. Load human.json</button><br>
        <button id="exportBtn" disabled>2. Download human.glb</button>
    </div>
    <div id="info">Drag to rotate • Scroll to zoom</div>
    <div id="status">Loading...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        let scene, camera, renderer, controls, currentModel;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3.5);

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.4));
            const dir = new THREE.DirectionalLight(0xffffff, 1.2);
            dir.position.set(8, 12, 10);
            scene.add(dir);

            // Simple floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshStandardMaterial({color:0x333333}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.95, 0);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Load button
        document.getElementById('loadBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                const status = document.getElementById('status');
                status.style.display = 'block';
                status.textContent = 'Parsing MakeHuman JSON...';

                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const json = JSON.parse(ev.target.result);

                        // Use a slightly older but more tolerant Three.js version for legacy MakeHuman JSON
                        const loader = new THREE.ObjectLoader();

                        // Clear previous model
                        if (currentModel) scene.remove(currentModel);

                        currentModel = loader.parse(json);

                        // Fix common issues after parsing
                        currentModel.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                if (!child.material) {
                                    child.material = new THREE.MeshStandardMaterial({color: 0xffaa88, roughness: 0.8});
                                }
                            }
                        });

                        scene.add(currentModel);

                        // Auto-center camera
                        const box = new THREE.Box3().setFromObject(currentModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        camera.position.set(center.x, center.y + maxDim*0.6, center.z + maxDim*1.4);
                        controls.target.copy(center);
                        controls.update();

                        document.getElementById('exportBtn').disabled = false;
                        status.style.display = 'none';
                        console.log('✅ Model parsed successfully');

                    } catch (err) {
                        console.error(err);
                        status.textContent = 'Parse failed: ' + err.message;
                        setTimeout(() => status.style.display = 'none', 4000);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        // Export button
        document.getElementById('exportBtn').onclick = () => {
            if (!currentModel) return;
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.textContent = 'Exporting to GLB...';

            const exporter = new THREE.GLTFExporter();
            exporter.parse(currentModel, result => {
                const blob = new Blob([result], {type: 'application/octet-stream'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'human.glb';
                a.click();
                URL.revokeObjectURL(url);
                status.style.display = 'none';
            }, { binary: true });
        };

        init();
    </script>
</body>
</html>
