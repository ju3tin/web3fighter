

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>makehuman-js example Web UI</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
<div id="info"><a href="github.com/makehuman-js/makehuman-js">makehuman-js</a> example Web UI</div>
<div id="stats"></div>
<div id="nav"></div>
<div id="container"></div>
<div id="progress-bar"></div>
<button id="downloadGLB">Download GLB</button>
    </body>
   <!-- dat.gui (latest 0.7.x) -->
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

<!-- three.js (latest stable – use module build instead of tsl) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<!-- lodash (latest 4.x) -->
<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>

<!-- GLTFExporter (must match your THREE version!) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/exporters/GLTFExporter.js"></script>

<!-- FileSaver (latest 2.x) -->
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<!-- stats.js (latest r17) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>

<!-- nanobar (latest 0.4.2 – still current) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/nanobar/0.4.2/nanobar.min.js"></script>
    <script src="/js/OrbitControls.js"></script>
    <script src="/js/Projector.js"></script>
    <script src="/js/Detector.js"></script>
    <script src="node_modules/makehuman-js/dist/makehuman.js" charset="utf-8"></script>
    <script src="/js/main.js" charset="utf-8"></script>
    <script type="text/javascript">

    var app
    // load some json data first
    var loadUrls = {
        modeling_sliders: 'makehuman-data/src/json/sliders/modeling_sliders.json',
        resources: 'makehuman-data/public/data/resources.json'
    }
    var loader = new THREE.XHRLoader();
    Promise.all(
        _.values(loadUrls).map((url) => new Promise((resolve, reject) =>
                loader.load(
                    url,
                    (data) => resolve(JSON.parse(data))
                )
            )
        )
    )
    .then(data => {
        var keys = Object.keys(loadUrls)
        for (var i = 0; i < keys.length; i++) {
            key = keys[i]
            window[key]=data[i]
        }
    })
    .then(() => {
        // start the app
        resources.baseUrl = "makehuman-data/public/data/"
        app = new App(resources, modeling_sliders)
        app.init()
        app.animate()
    })
    async function downloadGLB() {
    // ensure exporter + saver exist
    if (!THREE.GLTFExporter) {
        await loadScript("https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/exporters/GLTFExporter.js");
    }

    if (!window.saveAs) {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js");
    }

    const exporter = new THREE.GLTFExporter();

    // important: update transforms
    self.human.updateMatrixWorld(true);

    exporter.parse(
        self.human, // or self.scene
        (result) => {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            saveAs(blob, 'avatar.glb');
        },
        { binary: true }
    );
}
    </script>
</html>
