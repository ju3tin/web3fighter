<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MakeHuman JSON → GLB Viewer (Fixed for uuid error)</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:Arial, sans-serif; }
        canvas { display:block; }
        #ui { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; z-index:100; }
        button { padding:12px 18px; margin:5px 0; font-size:16px; cursor:pointer; }
        #error { position:absolute; top:10px; right:10px; background:#900; color:white; padding:12px; border-radius:6px; max-width:450px; display:none; }
        #status { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); padding:20px 40px; border-radius:10px; display:none; }
    </style>
</head>
<body>
    <div id="ui">
        <button id="loadBtn">1. Load your human.json</button><br>
        <button id="exportBtn" disabled>2. Download as human.glb</button>
    </div>
    <div id="error"></div>
    <div id="status">Loading & fixing JSON...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        let scene, camera, renderer, controls, model;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222233);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.2));
            const dir = new THREE.DirectionalLight(0xffffff, 1.1);
            dir.position.set(6, 12, 10);
            scene.add(dir);

            // Simple floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1, 0);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Load button
        document.getElementById('loadBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                document.getElementById('error').style.display = 'none';
                document.getElementById('status').style.display = 'block';

                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        let json = JSON.parse(ev.target.result);

                        // === FIX 1: Repair common MakeHuman JSON issues ===
                        if (json.geometries) {
                            json.geometries.forEach(g => {
                                if (g.type === "Geometry" && g.data && g.data.vertices) {
                                    // Force BufferGeometry conversion later
                                    g.type = "BufferGeometry";
                                }
                            });
                        }

                        const loader = new THREE.ObjectLoader();
                        model = loader.parse(json);

                        // === FIX 2: Clean up undefined objects and convert old Geometry ===
                        model.traverse(child => {
                            if (!child) return;

                            if (child.isMesh) {
                                if (child.geometry && child.geometry.type === "Geometry") {
                                    child.geometry = new THREE.BufferGeometry().fromGeometry(child.geometry);
                                }
                                if (!child.material) {
                                    child.material = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, skinning: true });
                                }
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }

                            // Ensure every object has a uuid (prevents the exact error you saw)
                            if (!child.uuid) child.uuid = THREE.MathUtils.generateUUID();
                        });

                        // Remove old model if any
                        while (scene.children.length > 3) scene.remove(scene.children[3]);
                        scene.add(model);

                        // Auto-center camera
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        camera.position.set(center.x, center.y + size.y * 0.8, center.z + size.z * 1.6);
                        controls.target.copy(center);
                        controls.update();

                        document.getElementById('exportBtn').disabled = false;
                        document.getElementById('status').style.display = 'none';
                        console.log('✅ Model loaded and fixed successfully');

                    } catch (err) {
                        document.getElementById('status').style.display = 'none';
                        document.getElementById('error').innerHTML = `<strong>Error:</strong><br>${err.message}<br><br>Copy this full error and send it to me if it still fails.`;
                        document.getElementById('error').style.display = 'block';
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        // Export button
        document.getElementById('exportBtn').onclick = () => {
            if (!model) return;
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = 'Exporting GLB...';

            const exporter = new THREE.GLTFExporter();
            exporter.parse(model, (result) => {
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'human.glb';
                a.click();
                URL.revokeObjectURL(url);
                document.getElementById('status').style.display = 'none';
            }, { binary: true });
        };

        init();
    </script>
</body>
</html>
