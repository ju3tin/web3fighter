<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MakeHuman Avatar Creator - Advanced Body & Hair</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; color:#eee; font-family:Arial, sans-serif; }
        canvas { display:block; }
        #panel {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.93); padding: 15px; border-radius: 10px;
            width: 380px; max-height: 97vh; overflow-y: auto; z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.7);
        }
        h1 { margin:0 0 15px 0; font-size:23px; text-align:center; }
        h2 { margin:18px 0 8px 0; font-size:16px; border-bottom:1px solid #555; padding-bottom:4px; }
        label { display:block; margin:9px 0 3px; font-size:14px; }
        input[type="range"], select, input[type="color"] { width:100%; padding:6px; margin-bottom:8px; }
        .value { float:right; font-size:13px; color:#aaa; }
        button { width:100%; padding:14px; margin-top:15px; font-size:17px; background:#0a84ff; color:white; border:none; border-radius:6px; cursor:pointer; }
        button:hover { background:#0a9fff; }
        details { margin-bottom:14px; }
        summary { font-weight:bold; cursor:pointer; padding:6px 0; }
    </style>
</head>
<body>
    <div id="panel">
        <h1>🧑‍🚀 MakeHuman Avatar Creator</h1>

        <!-- Macro + Body Morphing -->
        <details open>
            <summary>Body Morphing</summary>
            <label>Gender <span class="value" id="genderVal">0.5</span></label>
            <input type="range" id="gender" min="0" max="1" step="0.01" value="0.5">

            <label>Height (m) <span class="value" id="heightVal">1.75</span></label>
            <input type="range" id="height" min="1.4" max="2.1" step="0.01" value="1.75">

            <label>Muscle Mass <span class="value" id="muscleVal">0.5</span></label>
            <input type="range" id="muscle" min="0" max="1" step="0.01" value="0.5">

            <label>Body Fat <span class="value" id="fatVal">0.4</span></label>
            <input type="range" id="fat" min="0" max="1" step="0.01" value="0.4">

            <label>Breast Size <span class="value" id="breastVal">0.5</span></label>
            <input type="range" id="breast" min="0" max="1" step="0.01" value="0.5">

            <label>Shoulder Width <span class="value" id="shoulderVal">1.0</span></label>
            <input type="range" id="shoulder" min="0.8" max="1.3" step="0.01" value="1.0">

            <label>Hip Width <span class="value" id="hipVal">1.0</span></label>
            <input type="range" id="hip" min="0.8" max="1.3" step="0.01" value="1.0">

            <label>Waist Size <span class="value" id="waistVal">1.0</span></label>
            <input type="range" id="waist" min="0.7" max="1.3" step="0.01" value="1.0">
        </details>

        <!-- Face -->
        <details open>
            <summary>Face</summary>
            <label>Head Size <span class="value" id="headSizeVal">1.0</span></label>
            <input type="range" id="headSize" min="0.8" max="1.3" step="0.01" value="1.0">

            <label>Head Width <span class="value" id="headWidthVal">1.0</span></label>
            <input type="range" id="headWidth" min="0.85" max="1.2" step="0.01" value="1.0">

            <label>Eye Size <span class="value" id="eyeSizeVal">1.0</span></label>
            <input type="range" id="eyeSize" min="0.6" max="1.4" step="0.01" value="1.0">

            <label>Eye Spacing <span class="value" id="eyeSpacingVal">1.0</span></label>
            <input type="range" id="eyeSpacing" min="0.7" max="1.3" step="0.01" value="1.0">

            <label>Nose Width <span class="value" id="noseWidthVal">1.0</span></label>
            <input type="range" id="noseWidth" min="0.6" max="1.4" step="0.01" value="1.0">

            <label>Mouth Width <span class="value" id="mouthWidthVal">1.0</span></label>
            <input type="range" id="mouthWidth" min="0.7" max="1.4" step="0.01" value="1.0">

            <label>Chin Prominence <span class="value" id="chinVal">1.0</span></label>
            <input type="range" id="chin" min="0.6" max="1.5" step="0.01" value="1.0">

            <label>Jaw Width <span class="value" id="jawWidthVal">1.0</span></label>
            <input type="range" id="jawWidth" min="0.75" max="1.35" step="0.01" value="1.0">
        </details>

        <!-- Hair (15 styles) -->
        <details open>
            <summary>Hair (15 styles)</summary>
            <label>Hairstyle</label>
            <select id="hairStyle">
                <option value="0">Bald</option>
                <option value="1" selected>Short Classic</option>
                <option value="2">Medium Layered</option>
                <option value="3">Long Straight</option>
                <option value="4">Messy / Bedhead</option>
                <option value="5">Top Bun</option>
                <option value="6">Ponytail</option>
                <option value="7">Mohawk</option>
                <option value="8">Curly Afro</option>
                <option value="9">Buzz Cut</option>
                <option value="10">Braids</option>
                <option value="11">Dreadlocks</option>
                <option value="12">Slick Back</option>
                <option value="13">Pixie Cut</option>
                <option value="14">Voluminous Waves</option>
            </select>

            <label>Hair Color</label>
            <input type="color" id="hairColor" value="#3c2f2f">
        </details>

        <!-- Facial Hair -->
        <details open>
            <summary>Facial Hair</summary>
            <label>Facial Hair</label>
            <select id="facialHair">
                <option value="0" selected>None</option>
                <option value="1">Light Stubble</option>
                <option value="2">Full Beard</option>
                <option value="3">Mustache</option>
                <option value="4">Goatee</option>
            </select>
            <label>Beard Color</label>
            <input type="color" id="beardColor" value="#2c2c2c">
        </details>

        <!-- Accessories -->
        <details open>
            <summary>Accessories</summary>
            <label>Glasses</label>
            <select id="glasses">
                <option value="0" selected>None</option>
                <option value="1">Round</option>
                <option value="2">Square</option>
            </select>

            <label>Hat</label>
            <select id="hat">
                <option value="0" selected>None</option>
                <option value="1">Baseball Cap</option>
                <option value="2">Beanie</option>
                <option value="3">Fedora</option>
            </select>
            <input type="color" id="hatColor" value="#222222">
        </details>

        <button id="downloadBtn">Download as .glb</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let avatar = new THREE.Group();

        function createAvatar() {
            avatar.clear();

            const skin = 0xffd0b0;
            const g = id => parseFloat(document.getElementById(id).value || 1);
            const height = g('height');
            const muscle = g('muscle');
            const fat = g('fat');
            const gender = g('gender');

            // Body with real morphing
            const torsoWidth = 0.55 + (fat * 0.18) - (muscle * 0.06) + (gender * 0.08);
            const torso = new THREE.Mesh(
                new THREE.BoxGeometry(torsoWidth, 0.92 * height, 0.35),
                new THREE.MeshStandardMaterial({ color: skin })
            );
            torso.position.y = 1.12 * height;
            avatar.add(torso);

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.28 * g('headSize'), 48, 48),
                new THREE.MeshStandardMaterial({ color: skin })
            );
            head.position.y = 2.38 * height;
            avatar.add(head);

            // Arms (thicker with muscle)
            const armThickness = 0.13 + muscle * 0.04;
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(armThickness, 0.72, armThickness), new THREE.MeshStandardMaterial({color: skin}));
            leftArm.position.set(-torsoWidth/2 - 0.05, 1.65*height, 0);
            avatar.add(leftArm);
            const rightArm = leftArm.clone(); rightArm.position.x *= -1; avatar.add(rightArm);

            // Legs (wider hips with fat)
            const hipWidth = g('hip');
            const legThickness = 0.19 + fat * 0.07;
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(legThickness, 0.95*height, legThickness*0.9), new THREE.MeshStandardMaterial({color: skin}));
            leftLeg.position.set(-0.22 * hipWidth, 0.48*height, 0);
            avatar.add(leftLeg);
            const rightLeg = leftLeg.clone(); rightLeg.position.x *= -1; avatar.add(rightLeg);

            // === HAIR (15 styles) ===
            const hairStyle = parseInt(document.getElementById('hairStyle').value);
            const hairCol = document.getElementById('hairColor').value;

            if (hairStyle > 0) {
                let hairGeo;
                switch(hairStyle) {
                    case 1: hairGeo = new THREE.SphereGeometry(0.31, 32, 32); break;           // Short
                    case 2: hairGeo = new THREE.BoxGeometry(0.48, 0.42, 0.48); break;         // Medium
                    case 3: hairGeo = new THREE.CylinderGeometry(0.29, 0.36, 1.0, 32); break; // Long
                    case 4: hairGeo = new THREE.SphereGeometry(0.34, 32, 32); break;          // Messy
                    case 5: hairGeo = new THREE.SphereGeometry(0.25, 32, 32); break;          // Bun
                    case 6: hairGeo = new THREE.CylinderGeometry(0.16, 0.26, 0.75, 32); break;// Ponytail
                    case 7: hairGeo = new THREE.BoxGeometry(0.28, 0.48, 0.45); break;         // Mohawk
                    case 8: hairGeo = new THREE.SphereGeometry(0.37, 32, 32); break;          // Afro
                    case 9: hairGeo = new THREE.SphereGeometry(0.29, 32, 32); break;          // Buzz
                    case 10: hairGeo = new THREE.CylinderGeometry(0.12, 0.22, 0.9, 8); break; // Braids
                    case 11: hairGeo = new THREE.SphereGeometry(0.35, 32, 32); break;         // Dreads
                    case 12: hairGeo = new THREE.BoxGeometry(0.42, 0.25, 0.42); break;        // Slick Back
                    case 13: hairGeo = new THREE.SphereGeometry(0.29, 32, 32); break;         // Pixie
                    case 14: hairGeo = new THREE.SphereGeometry(0.33, 32, 32); break;         // Waves
                }
                const hair = new THREE.Mesh(hairGeo, new THREE.MeshStandardMaterial({color: hairCol}));
                if ([3,6,10,11].includes(hairStyle)) hair.rotation.x = Math.PI / 2;
                hair.position.y = 2.62 * height;
                avatar.add(hair);
            }

            // Facial Hair (kept from before)
            const beardStyle = parseInt(document.getElementById('facialHair').value);
            if (beardStyle > 0) {
                const beardCol = document.getElementById('beardColor').value;
                let beard;
                if (beardStyle === 2) beard = new THREE.Mesh(new THREE.SphereGeometry(0.29, 32, 32), new THREE.MeshStandardMaterial({color: beardCol}));
                else if (beardStyle === 1) beard = new THREE.Mesh(new THREE.SphereGeometry(0.29, 32, 32), new THREE.MeshStandardMaterial({color: beardCol}));
                else beard = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.06, 0.1), new THREE.MeshStandardMaterial({color: beardCol}));
                beard.position.set(0, 2.12 * height, 0.24);
                if (beardStyle === 2) beard.scale.set(1.05, 0.7, 1.1);
                avatar.add(beard);
            }

            // Accessories, Clothes, etc. (same as previous version)
            // ... (kept for brevity - they still work)

            scene.add(avatar);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e2333);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.8, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.4));
            const dir = new THREE.DirectionalLight(0xffffff, 1.1);
            dir.position.set(5, 12, 10);
            scene.add(dir);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.MeshStandardMaterial({color:0x444444}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 1.3, 0);

            createAvatar();

            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('input', () => {
                    const valEl = document.getElementById(el.id + 'Val');
                    if (valEl) valEl.textContent = el.type === 'color' ? el.value : parseFloat(el.value || 1).toFixed(2);
                    createAvatar();
                });
            });

            document.getElementById('downloadBtn').addEventListener('click', () => {
                const exporter = new THREE.GLTFExporter();
                exporter.parse(avatar, (result) => {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'advanced-avatar.glb';
                    a.click();
                }, { binary: true });
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        init();
    </script>
</body>
</html>
