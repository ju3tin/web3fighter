<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MakeHuman JSON → GLB Viewer (Fixed)</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:Arial; }
        canvas { display:block; }
        #ui { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); padding:15px; border-radius:8px; }
        button { padding:10px 15px; margin:5px; font-size:16px; }
        #error { position:absolute; top:10px; right:10px; background:#900; color:white; padding:10px; border-radius:6px; max-width:400px; display:none; }
    </style>
</head>
<body>
    <div id="ui">
        <button id="loadBtn">1. Load human.json</button><br>
        <button id="exportBtn" disabled>2. Download human.glb</button>
    </div>
    <div id="error"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        let scene, camera, renderer, controls, model;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222233);
            camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.2));
            const dl = new THREE.DirectionalLight(0xffffff, 1);
            dl.position.set(5,10,8);
            scene.add(dl);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0,1,0);

            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        document.getElementById('loadBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                document.getElementById('error').style.display = 'none';
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        const loader = new THREE.ObjectLoader();
                        model = loader.parse(json);

                        // Fix old Geometry → BufferGeometry
                        model.traverse(child => {
                            if (child.isMesh && child.geometry && child.geometry.type === "Geometry") {
                                child.geometry = new THREE.BufferGeometry().fromGeometry(child.geometry);
                            }
                            if (child.isMesh) {
                                child.castShadow = child.receiveShadow = true;
                            }
                        });

                        // Remove old model
                        while (scene.children.length > 3) scene.remove(scene.children[3]);
                        scene.add(model);

                        // Center camera
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        camera.position.set(center.x, center.y + size.y*0.8, center.z + size.z*1.8);
                        controls.target.copy(center);
                        controls.update();

                        document.getElementById('exportBtn').disabled = false;
                    } catch (err) {
                        document.getElementById('error').innerHTML = `<strong>Error:</strong><br>${err.message}<br><br>Please paste this full error in the chat.`;
                        document.getElementById('error').style.display = 'block';
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        document.getElementById('exportBtn').onclick = () => {
            if (!model) return;
            const exporter = new THREE.GLTFExporter();
            exporter.parse(model, result => {
                const blob = new Blob([result], {type: 'application/octet-stream'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'human.glb';
                a.click();
            }, { binary: true });
        };

        init();
    </script>
</body>
</html>
